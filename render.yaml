services:
  - type: web
    name: chainintel-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: (alembic upgrade head || true) && python -m app.core.init_db && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    disk:
      name: chainintel-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_MODE
        value: LIVE
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:////var/data/chainintel.db
      - key: EVIDENCE_DIR
        value: /var/data/evidence
