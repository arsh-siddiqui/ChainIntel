services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////var/data/chainintel.db
      EVIDENCE_DIR: /var/data/evidence
      APP_MODE: LIVE
      CORS_ORIGINS: http://localhost:3000
      MONITORING_ENABLED: "true"
      POLL_INTERVAL_SECONDS: "60"
      # Live blockchain providers: Bitcoin works keylessly; add EVM keys as needed.
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      MORALIS_API_KEY: "${MORALIS_API_KEY:-}"
      ANKR_API_KEY: "${ANKR_API_KEY:-}"
    ports:
      - "${BACKEND_PORT:-8099}:8000"
    volumes:
      - chainintel_data:/var/data

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8099}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  chainintel_data:
