services:
  - type: web
    name: chainintel-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: DEMO
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: chainintel-postgres
          property: connectionString

databases:
  - name: chainintel-postgres
    databaseName: chainintel
    user: chainintel
